[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,config/*.json,localization/*.json,assets/son-yolcu/*-LICENSE.txt,assets/template/fonts/*-OFL.txt,assets/template/fonts/display/*-OFL.txt"
exclude_filter="dist/*,test/*,test-output/*,captures/*,docs/*,assets/template/provenance/*,tools/*"
export_path="dist/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/loading.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144="res://assets/son-yolcu/icon-144.png"
progressive_web_app/icon_180x180="res://assets/son-yolcu/icon-180.png"
progressive_web_app/icon_512x512="res://assets/son-yolcu/favicon.png"
progressive_web_app/background_color=Color(0.063, 0.071, 0.086, 1)
